spring:
  datasource:
    # Configuration Oracle spécifique à P1
    oracle:
      jdbc-url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
      username: myuser
      password: mypassword
      driver-class-name: oracle.jdbc.OracleDriver
    
    # Configuration Trino spécifique à P1
    trino:
      jdbc-url: jdbc:trino://localhost:8080/tpch/sf1?SSL=false
      username: tpch
      password:
      driver-class-name: io.trino.jdbc.TrinoDriver

# Configuration des tables spécifiques à P1
batch:
  # Paramètres généraux
  chunk-size: 10000
  throttle-limit: 4
  max-retries: 3
  
  # Configuration du pool de threads
  thread-pool:
    core-size: 4
    max-size: 8
    queue-capacity: 20
  
  # Tables à traiter
  tables:
    orders:
      source-schema: sf1
      source-table: orders
      target-schema: public
      target-table: orders
    
    customer:
      source-schema: sf1
      source-table: customer
      target-schema: public
      target-table: customer
